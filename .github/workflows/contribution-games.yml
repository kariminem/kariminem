# Regenerates the animated contribution graphs (Pac-Man + snake) shown in README.md
# and pushes them to the `output` branch, so `main` stays clean.

name: Generate contribution animations

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Increase Node memory
        run: echo "NODE_OPTIONS=--max-old-space-size=8192" >> $GITHUB_ENV

      # Writes dist/pacman-contribution-graph.svg and dist/pacman-contribution-graph-dark.svg
      - name: Generate Pac-Man graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman
          player_style: aggressive

      - name: Generate snake graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00D9FF&color_dots=#161b22,#0e4a5c,#0b7a94,#00a8cc,#00D9FF

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
